services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  bot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.bot"]
    env_file: .env
    depends_on:
      - telegram-bot-api
    volumes:
      # Read/write is required so the bot can remove temporary Local Bot API files
      # after they have been uploaded to object storage.
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - app-data:/app/data

  web:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      - telegram-bot-api
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data

volumes:
  telegram-bot-api-data:
  app-data:
