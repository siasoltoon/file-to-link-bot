name: Windows Cloud RDP + File To Link Bot

on:
  workflow_dispatch:
    inputs:
      connection_count:
        description: "Independent Telegram MTProto download connections"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "6"
          - "8"

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_DOWNLOAD_CONNECTIONS: ${{ inputs.connection_count }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      DIRECT_LINK_EXPIRES_SECONDS: 604800
      MAX_FILE_BYTES: 2000000000

    steps:
      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Enabling Remote Desktop..."
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          Write-Host "Remote Desktop enabled."

      - name: 2. Create Temporary RDP Administrator
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) { throw "RDP_PASSWORD repository secret is missing." }
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $existingUser = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue
          if (-not $existingUser) {
              New-LocalUser -Name "NvDAdmin" -Password $securePassword -PasswordNeverExpires -AccountNeverExpires -Description "Temporary GitHub Actions RDP administrator"
          } else {
              Set-LocalUser -Name "NvDAdmin" -Password $securePassword
          }
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          Write-Host "RDP administrator created: NvDAdmin"

      - name: 3. Install and Configure Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) { throw "TAILSCALE_AUTHKEY repository secret is missing." }
          $installer = "$env:TEMP\tailscale-setup.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -NoNewWindow
          $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) { $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe" }
          if (-not (Test-Path $tailscale)) { throw "Tailscale executable was not found after installation." }
          & $tailscale up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-file-link-server"
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed." }
          Start-Sleep -Seconds 5
          $ip = & $tailscale ip -4
          if ([string]::IsNullOrWhiteSpace($ip)) { throw "Could not obtain Tailscale IPv4 address." }
          Write-Host "============================================"
          Write-Host "Tailscale RDP Server"
          Write-Host "============================================"
          Write-Host "IP Address : $ip"
          Write-Host "Username   : NvDAdmin"
          Write-Host "RDP password is stored in GitHub Secrets."
          Write-Host "============================================"

      - name: 4. Clone File To Link Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $botPath = "C:\file-to-link-bot"
          if (Test-Path $botPath) { Remove-Item -Path $botPath -Recurse -Force }
          git clone --branch main --single-branch "https://github.com/siasoltoon/file-to-link-bot.git" $botPath
          Set-Location $botPath
          Write-Host "Bot repository cloned."
          Write-Host "Commit: $(git rev-parse --short HEAD)"

      - name: 5. Restore Persistent Telegram Session
        uses: actions/cache@v4
        with:
          path: C:\file-to-link-bot\file-to-link-bot.session
          key: file-to-link-bot-telegram-session-v1

      - name: 6. Bootstrap Windows Bot Environment
        shell: powershell
        working-directory: C:\file-to-link-bot
        run: |
          $ErrorActionPreference = "Stop"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\setup_windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows bootstrap failed." }

      - name: 7. Validate Bot Configuration
        shell: powershell
        working-directory: C:\file-to-link-bot
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("BOT_TOKEN","TELEGRAM_API_ID","TELEGRAM_API_HASH","S3_ENDPOINT_URL","S3_ACCESS_KEY_ID","S3_SECRET_ACCESS_KEY","S3_BUCKET")
          foreach ($name in $required) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ([string]::IsNullOrWhiteSpace($value)) { throw "Required bot environment variable is missing: $name" }
              Write-Host "OK: $name is configured"
          }
          Write-Host "Telegram downloader connections: $env:TELEGRAM_DOWNLOAD_CONNECTIONS"
          if (Test-Path "C:\file-to-link-bot\file-to-link-bot.session") {
              Write-Host "Persistent Telegram session: restored"
              "TELEGRAM_SESSION_RESTORED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
              Write-Host "Persistent Telegram session: not found; first authorization may be rate-limited"
              "TELEGRAM_SESSION_RESTORED=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          py -3.13 scripts\healthcheck.py
          if ($LASTEXITCODE -ne 0) { throw "Bot health check failed." }

      - name: 8. Start File To Link Bot
        shell: powershell
        working-directory: C:\file-to-link-bot
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = "C:\file-to-link-bot\bot.log"
          $stderr = "C:\file-to-link-bot\bot-error.log"
          $pidFile = "C:\file-to-link-bot\bot.pid"
          $maxFloodWaitRetries = 2
          $started = $false

          for ($attempt = 1; $attempt -le ($maxFloodWaitRetries + 1); $attempt++) {
              Remove-Item $stdout,$stderr,$pidFile -Force -ErrorAction SilentlyContinue
              $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
              if ([string]::IsNullOrWhiteSpace($python) -or -not (Test-Path $python)) { throw "Could not resolve the Python 3.13 executable." }

              Write-Host "Starting File To Link Bot (attempt $attempt)..."
              $process = Start-Process -FilePath $python -ArgumentList "-u -m app.bot" -WorkingDirectory "C:\file-to-link-bot" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
              $process.Id | Out-File -FilePath $pidFile -Encoding ascii
              Write-Host "Bot PID: $($process.Id)"
              Start-Sleep -Seconds 20
              $process.Refresh()

              if (-not $process.HasExited) {
                  Write-Host "Bot is running successfully."
                  $started = $true
                  break
              }

              $errorText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              if ($errorText -match "A wait of (\d+) seconds is required.*ImportBotAuthorizationRequest") {
                  $waitSeconds = [int]$Matches[1]
                  if ($attempt -le $maxFloodWaitRetries) {
                      Write-Host "Telegram authorization is rate-limited. Waiting $waitSeconds seconds before retrying."
                      if ($waitSeconds -gt 3300) { throw "Telegram authorization FloodWait is too long: $waitSeconds seconds." }
                      Start-Sleep -Seconds ($waitSeconds + 5)
                      continue
                  }
              }

              Write-Host "Bot exited unexpectedly. Exit code: $($process.ExitCode)"
              if (Test-Path $stderr) { Write-Host "===== BOT ERROR LOG ====="; Get-Content $stderr -Tail 250 }
              if (Test-Path $stdout) { Write-Host "===== BOT OUTPUT LOG ====="; Get-Content $stdout -Tail 250 }
              break
          }

          if (-not $started) { throw "File To Link Bot stopped during startup." }

      - name: 9. Keep Windows VM Alive
        shell: powershell
        working-directory: C:\file-to-link-bot
        run: |
          $ErrorActionPreference = "Stop"
          $botPath = "C:\file-to-link-bot"
          $pidFile = "$botPath\bot.pid"
          $stdout = "$botPath\bot.log"
          $stderr = "$botPath\bot-error.log"
          $monitorIntervalSeconds = 10
          $restartAttempts = 3
          if (-not (Test-Path $pidFile)) { throw "Bot PID file was not found." }
          $botPid = [int](Get-Content $pidFile)
          $startedAt = Get-Date
          $lastHeartbeatMinute = -1
          $keepAliveMinutes = if ($env:TELEGRAM_SESSION_RESTORED -eq "1") { 350 } else { 300 }
          Write-Host "============================================"
          Write-Host "Windows VM is ready"
          Write-Host "Bot PID: $botPid"
          Write-Host "Telegram download connections: $env:TELEGRAM_DOWNLOAD_CONNECTIONS"
          Write-Host "Persistent Telegram session restored: $env:TELEGRAM_SESSION_RESTORED"
          Write-Host "Health monitor interval: $monitorIntervalSeconds seconds"
          Write-Host "VM will remain alive for approximately $keepAliveMinutes minutes."
          Write-Host "============================================"
          $deadline = $startedAt.AddMinutes($keepAliveMinutes)
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds $monitorIntervalSeconds
              $process = Get-Process -Id $botPid -ErrorAction SilentlyContinue
              if ($process) {
                  $elapsedMinutes = [int]((New-TimeSpan -Start $startedAt -End (Get-Date)).TotalMinutes)
                  if ($elapsedMinutes -ne $lastHeartbeatMinute) {
                      Write-Host "[$elapsedMinutes minutes] VM alive | Bot PID $botPid running"
                      $lastHeartbeatMinute = $elapsedMinutes
                  }
                  continue
              }
              Write-Host "============================================"
              Write-Host "BOT CRASH DETECTED"
              Write-Host "Previous PID: $botPid"
              Write-Host "Time: $(Get-Date -Format o)"
              Write-Host "============================================"
              if (Test-Path $stderr) { Write-Host "===== BOT ERROR LOG BEFORE RESTART ====="; Get-Content $stderr -Tail 250 }
              if (Test-Path $stdout) { Write-Host "===== BOT OUTPUT LOG BEFORE RESTART ====="; Get-Content $stdout -Tail 250 }
              $restarted = $false
              for ($attempt = 1; $attempt -le $restartAttempts; $attempt++) {
                  Write-Host "Attempting bot restart $attempt/$restartAttempts..."
                  Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
                  $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
                  if ([string]::IsNullOrWhiteSpace($python) -or -not (Test-Path $python)) { throw "Could not resolve Python executable for bot restart." }
                  $process = Start-Process -FilePath $python -ArgumentList "-u -m app.bot" -WorkingDirectory $botPath -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
                  $botPid = $process.Id
                  $botPid | Out-File -FilePath $pidFile -Encoding ascii
                  Write-Host "New bot PID: $botPid"
                  Start-Sleep -Seconds 20
                  $process.Refresh()
                  if (-not $process.HasExited) {
                      Write-Host "Bot restart succeeded. New PID: $botPid"
                      $restarted = $true
                      break
                  }
                  Write-Host "Restarted bot exited. Exit code: $($process.ExitCode)"
                  if (Test-Path $stderr) { Write-Host "===== BOT ERROR LOG AFTER RESTART ====="; Get-Content $stderr -Tail 250 }
                  if (Test-Path $stdout) { Write-Host "===== BOT OUTPUT LOG AFTER RESTART ====="; Get-Content $stdout -Tail 250 }
                  if ($attempt -lt $restartAttempts) { Start-Sleep -Seconds 5 }
              }
              if (-not $restarted) { throw "Bot could not be kept running after $restartAttempts restart attempts." }
              $startedAt = Get-Date
              $lastHeartbeatMinute = -1
              Write-Host "Bot monitoring resumed immediately after successful restart."
          }
          Write-Host "$keepAliveMinutes-minute VM lifetime reached. Keep Alive finished normally."

      - name: 10. Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Stopping bot before runner shutdown..."
          $pidFile = "C:\file-to-link-bot\bot.pid"
          if (Test-Path $pidFile) {
              try {
                  $botPid = [int](Get-Content $pidFile)
                  Stop-Process -Id $botPid -Force -ErrorAction SilentlyContinue
                  Write-Host "Bot stopped."
              }
              catch {
                  Write-Host "Bot process was already stopped."
              }
          }
          Write-Host "Cleanup completed."
