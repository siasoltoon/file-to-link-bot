name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "123456:ci-placeholder"
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: "ci-placeholder"
      S3_ACCESS_KEY_ID: "ci-placeholder"
      S3_SECRET_ACCESS_KEY: "ci-placeholder"
      S3_BUCKET: "ci-placeholder"
      PUBLIC_BASE_URL: "https://example.test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app scripts

      - name: Verify Fil.one region and path-style client configuration
        run: |
          python - <<'PY'
          from app.config import settings
          from app.storage import storage

          assert settings.s3_region == "eu-west-1"
          assert settings.s3_endpoint_url == "https://s3.eu-west-1.filonecontent.com"
          assert storage.client.meta.config.s3["addressing_style"] == "path"
          assert storage.client.meta.config.signature_version == "s3v4"
          print("Fil.one configuration smoke test passed")
          PY
