name: Telegram Route Benchmark

on:
  workflow_dispatch:
    inputs:
      connection_count:
        description: "Independent Telegram download connections"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
      download_dc:
        description: "Telegram download DC"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "2"
          - "3"
          - "4"
          - "5"
  push:
    branches:
      - main

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_DOWNLOAD_CONNECTIONS: ${{ inputs.connection_count || '4' }}
      TELEGRAM_DOWNLOAD_WORKERS: "4"
      TELEGRAM_DOWNLOAD_DC: ${{ inputs.download_dc || 'auto' }}
      TELEGRAM_DOWNLOAD_PROXY_URL: ${{ secrets.TELEGRAM_DOWNLOAD_PROXY_URL }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      DIRECT_LINK_EXPIRES_SECONDS: 604800
      MAX_FILE_BYTES: 2000000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          py -3.13 -m pip install --upgrade pip
          py -3.13 -m pip install -r requirements.txt

      - name: Validate benchmark route configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) { throw "BOT_TOKEN is missing." }
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_API_ID)) { throw "TELEGRAM_API_ID is missing." }
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_API_HASH)) { throw "TELEGRAM_API_HASH is missing." }
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_DOWNLOAD_PROXY_URL)) {
              Write-Host "ROUTE MODE: direct"
          } else {
              Write-Host "ROUTE MODE: proxy"
              Write-Host "Proxy URL is configured through a GitHub Secret and will not be printed."
          }
          Write-Host "Connections: $env:TELEGRAM_DOWNLOAD_CONNECTIONS"
          Write-Host "Workers: $env:TELEGRAM_DOWNLOAD_WORKERS"
          Write-Host "Requested DC: $env:TELEGRAM_DOWNLOAD_DC"

      - name: Run bot route benchmark
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          py -3.13 -m app.bot
